<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03110a"/>
      <stop offset="1" stop-color="#0b2e1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7" stop-opacity="1"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#10b981" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="120" rx="16"/></clipPath>
    <clipPath id="fa">
      <rect x="200" y="30" width="500" height="34">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.05;0.22;1" values="0;0;500;500"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="120" fill="url(#bg)"/>
    <rect width="900" height="120" fill="url(#grid)"/>
    <circle cx="450.0" cy="60.0" r="260" fill="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="40" font-size="20" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" begin="0.0s" repeatCount="indefinite"/>
    </text>
    <text x="840" y="40" font-size="22" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" begin="1.0s" repeatCount="indefinite"/>
    </text>
    <path d="M0,100 q75,-12 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 L1800,120 L0,120 Z" fill="#10b981" fill-opacity="0.08">
      <animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,100 q75,-12 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0" fill="none" stroke="#10b981" stroke-opacity="0.55" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,108 q75,10 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="-300 0;0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(450,20)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        <path d="M0,-10 L2.9,-3.1 L10,-3.1 L4.3,1.6 L6.2,8.5 L0,4.5 L-6.2,8.5 L-4.3,1.6 L-10,-3.1 L-2.9,-3.1 Z" fill="#34d399"/>
      </g>
    </g>
    <text x="450" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#ecfdf5" clip-path="url(#fa)">Obrigado pela visita!</text>
    <text x="450" y="80" text-anchor="middle" font-size="14" fill="#6ee7b7" font-family="Consolas, 'Courier New', monospace">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.2;0.3;1" values="0;0;1;1"/>
      Curtiu algum projeto? Deixe uma estrela.
    </text>
    <rect x="-220" y="116" width="220" height="4" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1120 0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
