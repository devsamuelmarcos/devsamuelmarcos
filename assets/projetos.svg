<svg xmlns="http://www.w3.org/2000/svg" width="900" height="296" viewBox="0 0 900 296" font-family="{SANS}">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03110a"/>
      <stop offset="1" stop-color="#0b2e1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7" stop-opacity="1"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#10b981" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="296" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="296" fill="url(#bg)"/>
    <rect width="900" height="296" fill="url(#grid)"/>
    <circle cx="450" cy="148" r="280" fill="url(#glow)"/>

    <text x="36" y="34" font-size="15" fill="#34d399" font-family="{MONO}">&gt; projetos_destaque (Roblox &amp; Luau)
      <animate attributeName="opacity" dur="0.6s" fill="freeze" keyTimes="0;0.3;1" values="0;0;1"/>
    </text>

    <!-- Card 1: Classic Touch Soccer -->
    <g transform="translate(30, 52)">
      <rect width="840" height="100" rx="12" fill="#0f3d26" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="24" y="34" font-size="20" font-weight="700" fill="#ecfdf5">⚽ Classic Touch Soccer</text>
      <text x="24" y="60" font-size="14" fill="#a7f3d0">Jogo de futebol no Roblox com sistema de física e mecânicas de toque rápido.</text>
      <text x="24" y="80" font-size="13" fill="#6ee7b7" font-family="{MONO}">// Status: Ativo &amp; Jogável</text>

      <g transform="translate(650, 22)">
        <rect width="166" height="36" rx="18" fill="#0b2e1c" stroke="#34d399" stroke-width="1.2"/>
        <text x="83" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399" font-family="{MONO}">🔥 10.7k+ Visitas</text>
      </g>
    </g>

    <!-- Card 2: Ultimate Touch Soccer -->
    <g transform="translate(30, 166)">
      <rect width="840" height="100" rx="12" fill="#0f3d26" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="24" y="34" font-size="20" font-weight="700" fill="#ecfdf5">🎮 Ultimate Touch Soccer</text>
      <text x="24" y="60" font-size="14" fill="#a7f3d0">Evolução do Touch Soccer com gráficos renovados, novas mecânicas e servidor dedicado.</text>
      <text x="24" y="80" font-size="13" fill="#fbbf24" font-family="{MONO}">// Status: 🛠️ Em Desenvolvimento (ColdStyle Studio)</text>

      <g transform="translate(650, 22)">
        <rect width="166" height="36" rx="18" fill="#0b2e1c" stroke="#fbbf24" stroke-width="1.2"/>
        <text x="83" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24" font-family="{MONO}">⚡ Em Breve</text>
      </g>
    </g>

    <rect x="-220" y="292" width="220" height="4" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1120 0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
