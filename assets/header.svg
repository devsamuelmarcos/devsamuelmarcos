<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03110a"/>
      <stop offset="1" stop-color="#0b2e1c"/>
    </linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="650" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7" stop-opacity="1"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#10b981" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="220" rx="16"/></clipPath>
    <clipPath id="wipe">
      <rect x="0" y="60" width="900" height="90">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.34;0.46;1" values="0;0;900;900"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#grid)"/>

    <circle cx="450" cy="110" r="260" fill="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <text x="70" y="62" font-size="26" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" begin="0.0s" repeatCount="indefinite"/>
    </text>
    <text x="820" y="70" font-size="28" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="120" y="170" font-size="34" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" begin="2.1s" repeatCount="indefinite"/>
    </text>
    <text x="790" y="172" font-size="26" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">01
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" begin="0.7s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="120" font-size="22" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">( )
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" begin="1.8s" repeatCount="indefinite"/>
    </text>
    <text x="842" y="120" font-size="22" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">[ ]
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" begin="2.6s" repeatCount="indefinite"/>
    </text>

    <!-- borda de luz percorrendo a base -->
    <rect x="-220" y="216" width="220" height="4" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1120 0" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- FASE 1: CARREGAMENTO -->
    <g>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.28;0.31;1" values="1;1;0;0"/>

      <g transform="translate(450,58)">
        <circle r="18" fill="none" stroke="#14532d" stroke-width="4"/>
        <path d="M0,-18 A18,18 0 0 1 18,0" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        </path>
      </g>

      <text x="450" y="116" text-anchor="middle" fill="#a7f3d0" font-size="18" letter-spacing="1">Inicializando perfil...</text>

      <rect x="250" y="138" width="400" height="8" rx="4" fill="#0f3d26"/>
      <rect x="250" y="138" width="0" height="8" rx="4" fill="url(#acc)">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;1" values="0;400;400"/>
      </rect>

      <g font-size="15" fill="#6ee7b7" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">
      <text x="450" y="182" opacity="1">0%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.025;1" values="1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">10%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.025;0.050;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">20%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.050;0.075;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">30%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.075;0.100;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">40%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.100;0.125;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">50%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.150;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">60%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.150;0.175;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">70%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.175;0.200;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">80%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.200;0.225;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">90%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.225;0.250;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="182" opacity="0">100%
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.250;1" values="0;1;1"/>
      </text>
      </g>
    </g>

    <!-- FASE 2: APRESENTAÇÃO -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.31;0.34;0.94;1" values="0;0;1;1;0"/>

      <text x="368" y="58" font-size="16" fill="#34d399" font-family="Consolas, 'Courier New', monospace">&gt; devsamuelmarcos
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.33;0.38;1" values="0;0;1;1"/>
      </text>
      <rect x="536" y="45" width="9" height="16" fill="#34d399">
        <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0"/>
      </rect>

      <text x="450" y="124" text-anchor="middle" fill="url(#acc)" font-size="56" font-weight="700" letter-spacing="1" clip-path="url(#wipe)">Samuel Marcos</text>

      <rect x="300" y="142" width="300" height="3" rx="1.5" fill="url(#acc)">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.44;0.54;1" values="0;0;300;300"/>
      </rect>

      <text x="450" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#ecfdf5" letter-spacing="0.5">Desenvolvedor Java
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.58;1" values="0;0;1;1"/>
        <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.58;1" values="0 8;0 8;0 0;0 0"/>
      </text>
      <text x="450" y="196" text-anchor="middle" font-size="15" fill="#6ee7b7" letter-spacing="1.5">FOCO NO ESTUDO E NA EVOLUÇÃO CONSTANTE
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.55;0.63;1" values="0;0;1;1"/>
        <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.55;0.63;1" values="0 8;0 8;0 0;0 0"/>
      </text>
    </g>
  </g>
</svg>
