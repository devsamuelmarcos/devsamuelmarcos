<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b1f3b"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="650" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#bg)"/>

  <!-- TELA DE CARREGAMENTO -->
  <g>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.4;0.45;1" values="1;1;0;0"/>

    <g transform="translate(450,60)">
      <circle r="18" fill="none" stroke="#30363d" stroke-width="4"/>
      <path d="M0,-18 A18,18 0 0 1 18,0" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="450" y="120" text-anchor="middle" fill="#c9d1d9" font-size="20">Carregando perfil...</text>

    <rect x="250" y="140" width="400" height="10" rx="5" fill="#30363d"/>
    <rect x="250" y="140" width="0" height="10" rx="5" fill="url(#bar)">
      <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.38;1" values="0;400;400"/>
    </rect>

    <g font-size="16" fill="#8b949e" text-anchor="middle">
      <text x="450" y="180" opacity="0">0%
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08;1" values="1;0;0"/>
      </text>
      <text x="450" y="180" opacity="0">25%
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08;0.18;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="180" opacity="0">50%
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.18;0.28;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="180" opacity="0">75%
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.28;0.36;1" values="0;1;0;0"/>
      </text>
      <text x="450" y="180" opacity="0">100%
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.36;1" values="0;1;1"/>
      </text>
    </g>
  </g>

  <!-- APRESENTACAO -->
  <g opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.45;0.52;0.93;1" values="0;0;1;1;0"/>
    <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-size="22">Olá, eu sou</text>
    <text x="450" y="125" text-anchor="middle" fill="url(#bar)" font-size="54" font-weight="700">Samuel Marcos</text>
    <rect x="300" y="145" width="300" height="3" rx="1.5" fill="url(#bar)"/>
    <text x="450" y="185" text-anchor="middle" fill="#c9d1d9" font-size="20">Foco em Java · Criando jogos no Roblox</text>
  </g>
</svg>
