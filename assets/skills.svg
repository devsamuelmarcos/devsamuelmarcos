<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03110a"/>
      <stop offset="1" stop-color="#0b2e1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7" stop-opacity="1"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#10b981" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="120" rx="16"/></clipPath>
    <clipPath id="pills">
      <rect x="124.5" y="54" width="84" height="40" rx="10"/>
      <rect x="222.5" y="54" width="150" height="40" rx="10"/>
      <rect x="386.5" y="54" width="106" height="40" rx="10"/>
      <rect x="506.5" y="54" width="84" height="40" rx="10"/>
      <rect x="604.5" y="54" width="84" height="40" rx="10"/>
      <rect x="702.5" y="54" width="73" height="40" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="120" fill="url(#bg)"/>
    <rect width="900" height="120" fill="url(#grid)"/>
    <circle cx="450.0" cy="60.0" r="260" fill="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <text x="44" y="40" font-size="22" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" begin="0.0s" repeatCount="indefinite"/>
    </text>
    <text x="850" y="44" font-size="24" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="52" y="100" font-size="28" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" begin="2.1s" repeatCount="indefinite"/>
    </text>
    <text x="846" y="100" font-size="22" fill="#34d399" opacity="0.14" font-family="Consolas, 'Courier New', monospace">01
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" begin="0.7s" repeatCount="indefinite"/>
    </text>

    <text x="392" y="32" font-size="15" fill="#34d399" font-family="Consolas, 'Courier New', monospace">&gt; linguagens
      <animate attributeName="opacity" dur="0.6s" fill="freeze" keyTimes="0;0.3;1" values="0;0;1"/>
    </text>
    <rect x="507" y="20" width="8" height="14" fill="#34d399">
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" dur="1.20s" fill="freeze" keyTimes="0;0.417;1" values="0;0;1"/>
      <animateTransform attributeName="transform" type="translate" dur="1.20s" fill="freeze" calcMode="spline" keyTimes="0;0.417;1" keySplines="0 0 1 1;0.2 0.8 0.2 1" values="0 18;0 18;0 0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" begin="1.20s" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" values="0 0;0 -3;0 0"/>
        <rect x="124.5" y="54" width="84" height="40" rx="10" fill="#0f3d26" fill-opacity="0.85" stroke="#34d399" stroke-opacity="0.95" stroke-width="1.8"/>
        <text x="166.5" y="79.5" text-anchor="middle" fill="#ecfdf5" font-size="16" font-weight="700">Java</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="1.35s" fill="freeze" keyTimes="0;0.481;1" values="0;0;1"/>
      <animateTransform attributeName="transform" type="translate" dur="1.35s" fill="freeze" calcMode="spline" keyTimes="0;0.481;1" keySplines="0 0 1 1;0.2 0.8 0.2 1" values="0 18;0 18;0 0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" begin="1.55s" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" values="0 0;0 -3;0 0"/>
        <rect x="222.5" y="54" width="150" height="40" rx="10" fill="#0f3d26" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="297.5" y="79.5" text-anchor="middle" fill="#ecfdf5" font-size="16" font-weight="700">JavaScript</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="1.50s" fill="freeze" keyTimes="0;0.533;1" values="0;0;1"/>
      <animateTransform attributeName="transform" type="translate" dur="1.50s" fill="freeze" calcMode="spline" keyTimes="0;0.533;1" keySplines="0 0 1 1;0.2 0.8 0.2 1" values="0 18;0 18;0 0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" begin="1.90s" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" values="0 0;0 -3;0 0"/>
        <rect x="386.5" y="54" width="106" height="40" rx="10" fill="#0f3d26" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="439.5" y="79.5" text-anchor="middle" fill="#ecfdf5" font-size="16" font-weight="700">Python</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="1.65s" fill="freeze" keyTimes="0;0.576;1" values="0;0;1"/>
      <animateTransform attributeName="transform" type="translate" dur="1.65s" fill="freeze" calcMode="spline" keyTimes="0;0.576;1" keySplines="0 0 1 1;0.2 0.8 0.2 1" values="0 18;0 18;0 0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" begin="2.25s" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" values="0 0;0 -3;0 0"/>
        <rect x="506.5" y="54" width="84" height="40" rx="10" fill="#0f3d26" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="548.5" y="79.5" text-anchor="middle" fill="#ecfdf5" font-size="16" font-weight="700">Luau</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="1.80s" fill="freeze" keyTimes="0;0.611;1" values="0;0;1"/>
      <animateTransform attributeName="transform" type="translate" dur="1.80s" fill="freeze" calcMode="spline" keyTimes="0;0.611;1" keySplines="0 0 1 1;0.2 0.8 0.2 1" values="0 18;0 18;0 0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" begin="2.60s" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" values="0 0;0 -3;0 0"/>
        <rect x="604.5" y="54" width="84" height="40" rx="10" fill="#0f3d26" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="646.5" y="79.5" text-anchor="middle" fill="#ecfdf5" font-size="16" font-weight="700">HTML</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="1.95s" fill="freeze" keyTimes="0;0.641;1" values="0;0;1"/>
      <animateTransform attributeName="transform" type="translate" dur="1.95s" fill="freeze" calcMode="spline" keyTimes="0;0.641;1" keySplines="0 0 1 1;0.2 0.8 0.2 1" values="0 18;0 18;0 0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" begin="2.95s" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" values="0 0;0 -3;0 0"/>
        <rect x="702.5" y="54" width="73" height="40" rx="10" fill="#0f3d26" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="739.0" y="79.5" text-anchor="middle" fill="#ecfdf5" font-size="16" font-weight="700">CSS</text>
      </g>
    </g>

    <g clip-path="url(#pills)">
      <rect x="-90" y="0" width="60" height="120" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" begin="3s" dur="5s" repeatCount="indefinite" keyTimes="0;0.45;1" values="-90;960;960"/>
      </rect>
    </g>

    <rect x="-220" y="116" width="220" height="4" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1120 0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
